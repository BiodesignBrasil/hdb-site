<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Data Brasil · síntese do projeto</title>
<meta name="description" content="A síntese do projeto Health Data Brasil em uma tela: o contexto (quem precisa da prova, os três pacotes vendidos, a virada), as camadas da empresa nova (quem paga e quem ganha · das bases públicas à coorte · o que se vende · o que o cliente vive) e a direção: as três definições em aberto.">
<meta property="og:type" content="website">
<meta property="og:title" content="Health Data Brasil · o dado é de todos; a coorte, alguém paga para ter">
<meta property="og:description" content="Coortes a partir das bases públicas de saúde do Brasil, cruzadas pela mesma pessoa. O contexto, as camadas da empresa nova e o que falta definir, em uma tela.">
<meta property="og:url" content="https://biodesignbrasil.github.io/hdb-site/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=pub-17">
</head>
<body>

<!-- uma barra só (molde: a Sistemática da Longevidade): a marca, as abas como pílulas, o anel dos três Cs -->
<nav class="barra">
  <a class="wordmark" href="./"><span class="wm-nome">Health<span>Data</span> Brasil</span><span class="wm-sub">Síntese do projeto</span></a>
  <div class="nav-links" id="camadas" role="tablist" aria-label="o contexto, as camadas e a direção"></div>
</nav>

<main class="palco">
  <p class="pergunta" id="pergunta"></p>
  <p class="manchete" id="manchete"></p>

  <div class="vistas">
    <!-- 00 · a abertura: o laço dos três momentos à esquerda (figura + legenda), as sete perguntas à direita (28/10/2026, molde da Longevidade) -->
    <section class="vista v-contexto" id="v-contexto" role="tabpanel" aria-label="Abertura">
      <div class="cena cena-ctx" id="cena-ctx">
        <div class="laco-linha">
          <div class="laco" id="laco" aria-label="o laço dos três momentos: quem pergunta e o método; a pergunta, a coorte, a prova; a volta, por construir"></div>
          <div class="laco-leg" id="laco-leg" aria-label="os três momentos, com as etapas e os Cs de cada um"></div>
        </div>
      </div>
      <aside class="leitura leitura-ctx" id="leitura-ctx" aria-live="polite" data-piso="0.5"></aside>
    </section>

    <section class="vista v-dupla" id="v-ecossistema" role="tabpanel" aria-label="Ecossistema">
      <div class="cena"><svg id="eco" viewBox="0 0 900 540" role="img" aria-label="Quem paga a empresa nova, a empresa, e quem ganha com ela"></svg></div>
      <aside class="leitura" id="leitura-eco" aria-live="polite"></aside>
    </section>

    <section class="vista v-dupla cheia" id="v-sistema" role="tabpanel" aria-label="Sistema">
      <div class="cena">
        <div class="tempos" id="tempos" role="tablist" aria-label="o que olhar no sistema"></div>
        <div class="duo" id="duo" aria-label="os dois olhares, lado a lado">
          <svg id="sis1" viewBox="0 0 900 440" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Hoje, à mão: cada base em separado"></svg>
          <svg id="sis2" viewBox="0 0 900 440" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Com o HDB: os três Cs"></svg>
        </div>
        <svg id="sis" viewBox="0 0 900 440" role="img" aria-label="Das bases públicas à coorte: hoje à mão, e com o HDB"></svg>
      </div>
      <aside class="leitura" id="leitura-sis" aria-live="polite"></aside>
    </section>

    <!-- 03 · os três pacotes na largura inteira, cada um completo (28/10/2026: "a última coluna, pacote em aberto, é redundante") -->
    <section class="vista v-cheia" id="v-servicos" role="tabpanel" aria-label="Serviços">
      <div class="painel" id="portfolio"></div>
    </section>

    <section class="vista v-cheia" id="v-jornadas" role="tabpanel" aria-label="Jornadas">
      <div class="painel" id="blueprint"></div>
    </section>

    <section class="vista v-direcao" id="v-direcao" role="tabpanel" aria-label="Direção">
      <div class="painel" id="direcao" data-piso="0.55"></div>
    </section>
  </div>

  <p class="legenda-procedencia">
    <span class="lp lp-ok">confirmado</span>
    <span class="lp lp-prov">provável, ou leitura nossa</span>
    <span class="lp lp-aberto">em aberto, ou a confirmar</span>
    <span class="lp-fonte" id="carimbo">Base: vault do projeto Health Data Brasil. Sem valores em reais nesta peça.</span>
  </p>
</main>

<script src="js/data.js?v=pub-17"></script>
<script src="js/convergencia.js?v=pub-17"></script>
<script src="js/script.js?v=pub-17"></script>
</body>
</html>
